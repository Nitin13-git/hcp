[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hcp-protocol"
version = "0.1.0"
description = "Harness Context Protocol — a standard interface for agent harness state, verification, scope, and session lifecycle."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Nitin Kushwaha" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/hcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
